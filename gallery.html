<!DOCTYPE html>
<html lang="en">

  <title>Photo Showcase</title>

<body>
  <header>
    <h1>My Photo Showcase</h1>
  </header>
  <main>

    <figure>
      <img width="80px" height="80px" src="./images/cat.png" alt="cat">
      <figcaption>
         A cat is basically a tiny, furry ninja with razor-sharp hunting skills, lightning-fast reflexes, super sharp senses, and adorable features!
      </figcaption>
    </figure>
    <figure>
      <img width="80px" height="80px" src="./images/koala.jpeg" alt="cat">
      <figcaption>
        Koalas are classed as marsupials, a different group of mammals, where females have a special pouch (front-facing or backwards facing) for rearing their young. A female koala gives birth to live, under-developed offspring—also called joey—who instinctively climb inside its mother's pouch to finish development.
      </figcaption>
    </figure>
    <figure>
      <img width="80px" height="80px" src="./images/turtle.jpeg" alt="turtle">
      <figcaption>
        Turtles (order Testudines) are reptiles characterized by a special shell developed mainly from their ribs. Modern turtles are divided into two major groups, the Pleurodira (side necked turtles) and Cryptodira (hidden necked turtles), which differ in the way the head retracts.
      </figcaption>
    </figure>
    <img width="100px" height="100px" src="./images/racon.jpeg" alt="">
    <img width="80px" height="80px" src="./images/monky.jpeg" alt="monky">
    <img width="80px" height="80px" src="./images/mouse.jpeg" alt="mouse">
    <img width="70px" height="70px" src="./images/racon.jpeg" alt="racon"> <br>
